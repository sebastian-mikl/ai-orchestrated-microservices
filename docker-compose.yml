services:
  # Service Registry - must start first
  service-registry:
    build: ./service-registry
    container_name: service-registry
    ports:
      - "8004:8000"
    environment:
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
    volumes:
      - registry-data:/app/service_registry_vectorstore
      - registry-models:/app/models
    networks:
      - network-mesh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Core Services - depend on registry
  echo-node:
    build: ./nodes/echo-node
    container_name: echo-node
    ports:
      - "8001:8000"
    networks:
      - network-mesh
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  transform-node:
    build: ./nodes/transform-node
    container_name: transform-node
    ports:
      - "8002:8000"
    networks:
      - network-mesh
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  storage-node:
    build: ./nodes/storage-node
    container_name: storage-node
    ports:
      - "8003:8000"
    volumes:
      - storage-data:/app/data
    networks:
      - network-mesh
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # NEW: Hello World Service
  hello-world:
    build: ./nodes/hello-world
    container_name: hello-world
    ports:
      - "8008:8000"
    networks:
      - network-mesh
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Additional Services
  file-processor:
    build: ./nodes/file-processor
    container_name: file-processor
    ports:
      - "8005:8000"
    networks:
      - network-mesh
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  external-api:
    build: ./nodes/external-api
    container_name: external-api
    ports:
      - "8006:8000"
    networks:
      - network-mesh
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  data-validator:
    build: ./nodes/data-validator
    container_name: data-validator
    ports:
      - "8007:8000"
    networks:
      - network-mesh
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Original Orchestrator - now fallback only
  orchestrator:
    build: ./orchestrator
    container_name: orchestrator
    ports:
      - "8000:8000"
    networks:
      - network-mesh
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Web Interface (optional)
  web-interface:
    build: ./nodes/web-interface
    container_name: web-interface
    ports:
      - "8080:8080"
    networks:
      - network-mesh
    depends_on:
      service-registry:
        condition: service_healthy

volumes:
  storage-data:
  registry-data:
  registry-models:

networks:
  network-mesh:
    driver: bridge